name: Deploy Supabase Edge Functions

# Automatically deploy Edge Functions when changes are pushed to main
# This prevents the "dev works but production doesn't" problem

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:
    # Allow manual triggering for emergency deployments

permissions:
  contents: read

env:
  SUPABASE_PROJECT_ID: vltmrnjsubfzrgrtdqey

jobs:
  deploy:
    name: Deploy Edge Functions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy all functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          echo "Deploying Edge Functions to project $SUPABASE_PROJECT_ID..."

          # Link to project (uses access token from env)
          supabase link --project-ref $SUPABASE_PROJECT_ID

          # Deploy only functions whose source is in this repo. The hosted project
          # has historical orphan functions (deployed but source deleted) — looping
          # locally avoids "Entrypoint path does not exist" failures on those.
          # See .planning/BACKLOG.md → "Edge Function Orphan Audit".
          # --use-api: bundles server-side (no Docker required)
          # --no-verify-jwt: functions handle their own JWT verification internally;
          #   the gateway check rejects valid tokens from supabase.functions.invoke()
          for dir in supabase/functions/*/; do
            fn=$(basename "$dir")
            if [ "$fn" = "_shared" ]; then continue; fi
            if [ ! -f "${dir}index.ts" ]; then continue; fi
            echo "→ Deploying $fn"
            supabase functions deploy "$fn" --use-api --no-verify-jwt || exit 1
          done

          echo "Deployment complete!"

      - name: Verify deployment
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          echo "=== Deployed Functions ==="
          supabase functions list --project-ref $SUPABASE_PROJECT_ID
