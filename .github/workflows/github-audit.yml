name: GitHub Housekeeping Audit

on:
  schedule:
    - cron: '0 9 * * 1'  # Mondays 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run audit
        env:
          GITHUB_TOKEN: ${{ secrets.ORG_AUDIT_TOKEN || secrets.GITHUB_TOKEN }}
          ORG: Vibe-Marketer
        run: node scripts/github-audit.mjs > audit-report.md

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: github-audit-${{ github.run_id }}
          path: audit-report.md
          retention-days: 90

      - name: Print summary
        run: |
          echo "## GitHub Housekeeping Audit" >> $GITHUB_STEP_SUMMARY
          cat audit-report.md >> $GITHUB_STEP_SUMMARY
