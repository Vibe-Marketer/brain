name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Lint & Type Check ──────────────────────────────────────────────────────
  lint-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript type check
        run: npm run type-check

  # ─── npm audit (zero high/critical gate) ──────────────────────────────────
  npm-audit:
    name: npm audit (high/critical gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: npm audit --omit=dev (high+critical fails build)
        run: npm audit --omit=dev --audit-level=high

  # ─── Unit Tests ─────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:coverage -- --reporter=verbose
        env:
          # vitest.config.ts already injects these but make them explicit
          VITE_SUPABASE_URL: https://test.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: test-anon-key
          VITEST_LOAD_INTEGRATION_ENV: 'false'

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ─── E2E Smoke Tests (API / MCP only — no browser needed) ───────────────────
  e2e-smoke:
    name: E2E API Smoke Tests
    runs-on: ubuntu-latest
    # Only run on PRs and only when Supabase secrets are configured
    if: |
      github.event_name == 'pull_request' &&
      vars.SUPABASE_SECRETS_CONFIGURED == 'true'
    env:
      PLAYWRIGHT_PROJECT: api
      BASE_URL: ${{ secrets.STAGING_BASE_URL || 'https://brain-sable-kappa.vercel.app' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright (chromium only)
        run: npx playwright install --with-deps chromium

      - name: Run MCP API smoke tests
        run: npx playwright test --project=api
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CALLVAULTAI_LOGIN: ${{ secrets.CALLVAULTAI_LOGIN }}
          CALLVAULTAI_LOGIN_PASSWORD: ${{ secrets.CALLVAULTAI_LOGIN_PASSWORD }}

      # Standing proof for ticket 3d1da686: the REAL signup UI flow must work
      # against the deployed site, not just the bare /auth/v1/signup API.
      - name: Run signup UI E2E
        run: npx playwright test --project=signup
        env:
          PLAYWRIGHT_PROJECT: signup
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ─── RLS Regression Test (cross-org isolation safety net) ──────────────────
  #
  # Runs against an EPHEMERAL local Supabase stack, created fresh inside this
  # runner and destroyed when the job ends. It never touches production and
  # needs no secrets.
  #
  # Why it was rewritten (2026-09): the previous version gated itself on
  # dedicated test-project secrets and, when they were absent, wrote
  # "enabled=false" + ::notice:: and exited 0. Every downstream step was
  # skipped and the job reported GREEN. Cross-org isolation — the one
  # regression that leaks one customer's calls to another — was therefore
  # never actually verified on any pull request.
  #
  # The production guards are unchanged and still apply. See
  # src/test/integration-setup.ts and supabase/CLAUDE.md →
  # "Running integration tests safely". In particular isRealSupabaseUrl()
  # matches the host against [a-z0-9-]+, so `http://localhost:54321` passes
  # and `http://127.0.0.1:54321` does NOT (the dots fail the pattern) — an IP
  # literal here would make the suite skip silently again. Keep `localhost`.
  rls-regression:
    name: RLS Regression (Cross-Org Isolation)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Pin the last stable release. `latest` resolved to a 2.118 beta
          # that pulls ghcr.io/supabase/gotrue:v2.184.1 (manifest unknown).
          version: 2.117.0

      - name: Start ephemeral Supabase
        run: |
          # db + auth + rest + kong are enough for the RLS suite.
          # Skipping studio/storage/analytics avoids extra image pulls.
          supabase start -x studio,imgproxy,logflare,vector,mailpit,edge-runtime,realtime,storage-api,supavisor

      - name: Rebuild the database from every migration
        run: supabase db reset --no-seed

      - name: Disable local cron that would POST to production
        run: |
          set -eo pipefail
          # Several migrations schedule pg_cron jobs with hardcoded
          # https://vltmrnjsubfzrgrtdqey.supabase.co/functions/v1/... URLs.
          # Local pg_net would fire those from this runner. Unschedule
          # after reset (reset re-applies the jobs).
          supabase db query "select cron.unschedule(jobid) from cron.job;"

      - name: Export local test credentials
        run: |
          set -eo pipefail
          status="$(supabase status -o env)"
          anon="$(printf '%s\n' "$status" | grep -E '^(ANON_KEY|PUBLISHABLE_KEY)=' | head -1 | cut -d= -f2- | tr -d '"')"
          service="$(printf '%s\n' "$status" | grep -E '^(SERVICE_ROLE_KEY|SECRET_KEY)=' | head -1 | cut -d= -f2- | tr -d '"')"

          if [ -z "$anon" ] || [ -z "$service" ]; then
            echo "::error::Could not read local Supabase keys from 'supabase status -o env'."
            printf '%s\n' "$status"
            exit 1
          fi

          # localhost, never 127.0.0.1 — see the note on this job above.
          {
            echo "VITE_SUPABASE_TEST_URL=http://localhost:54321"
            echo "VITE_SUPABASE_TEST_ANON_KEY=$anon"
            echo "SUPABASE_TEST_SERVICE_ROLE_KEY=$service"
            echo "VITEST_LOAD_INTEGRATION_ENV=false"
          } >> "$GITHUB_ENV"

      - name: Assert the suite will actually run
        run: |
          set -eo pipefail
          if [ "${VITE_SUPABASE_TEST_URL:-}" != "http://localhost:54321" ]; then
            echo "::error::VITE_SUPABASE_TEST_URL is not the local stack — the suite would skip."
            exit 1
          fi
          if [ -z "${VITE_SUPABASE_TEST_ANON_KEY:-}" ] || [ -z "${SUPABASE_TEST_SERVICE_ROLE_KEY:-}" ]; then
            echo "::error::Local Supabase keys are missing — the suite would skip."
            exit 1
          fi

      - name: Run RLS regression test
        run: |
          set -eo pipefail
          npx vitest run src/test/rls-regression.test.ts --reporter=verbose 2>&1 | tee test-output.log

      - name: Fail if the suite skipped instead of running
        run: |
          set -eo pipefail
          # Strip ANSI so color codes between the count and "passed" cannot
          # hide a real run from the grep.
          plain="$(sed 's/\x1b\[[0-9;]*m//g' test-output.log)"
          if printf '%s\n' "$plain" | grep -qiE "[1-9][0-9]* skipped"; then
            echo "::error::RLS regression reported skipped tests. A green run here would be meaningless."
            exit 1
          fi
          if ! printf '%s\n' "$plain" | grep -qE "Tests[[:space:]]+[1-9][0-9]* passed"; then
            echo "::error::Could not confirm that any RLS test actually passed."
            exit 1
          fi
          echo "RLS regression executed against the ephemeral local database."

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rls-regression-output
          path: test-output.log
          retention-days: 7

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup
