name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Lint & Type Check ──────────────────────────────────────────────────────
  lint-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript type check
        run: npm run type-check

  # ─── npm audit (zero high/critical gate) ──────────────────────────────────
  npm-audit:
    name: npm audit (high/critical gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: npm audit --omit=dev (high+critical fails build)
        run: npm audit --omit=dev --audit-level=high

  # ─── Unit Tests ─────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:coverage -- --reporter=verbose
        env:
          # vitest.config.ts already injects these but make them explicit
          VITE_SUPABASE_URL: https://test.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: test-anon-key
          VITEST_LOAD_INTEGRATION_ENV: 'false'

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ─── E2E Smoke Tests (API / MCP only — no browser needed) ───────────────────
  e2e-smoke:
    name: E2E API Smoke Tests
    runs-on: ubuntu-latest
    # Only run on PRs and only when Supabase secrets are configured
    if: |
      github.event_name == 'pull_request' &&
      vars.SUPABASE_SECRETS_CONFIGURED == 'true'
    env:
      PLAYWRIGHT_PROJECT: api
      BASE_URL: ${{ secrets.STAGING_BASE_URL || 'https://brain-govibey.vercel.app' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright (chromium only)
        run: npx playwright install --with-deps chromium

      - name: Run MCP API smoke tests
        run: npx playwright test --project=api
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CALLVAULTAI_LOGIN: ${{ secrets.CALLVAULTAI_LOGIN }}
          CALLVAULTAI_LOGIN_PASSWORD: ${{ secrets.CALLVAULTAI_LOGIN_PASSWORD }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ─── RLS Regression Test (cross-org isolation safety net) ──────────────────
  rls-regression:
    name: RLS Regression (Cross-Org Isolation)
    runs-on: ubuntu-latest
    if: vars.SUPABASE_SECRETS_CONFIGURED == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate RLS regression secrets
        run: |
          url="${VITE_SUPABASE_TEST_URL:-$VITE_SUPABASE_URL}"
          anon="${VITE_SUPABASE_TEST_ANON_KEY:-$VITE_SUPABASE_PUBLISHABLE_KEY}"
          service="${SUPABASE_TEST_SERVICE_ROLE_KEY:-$SUPABASE_SERVICE_ROLE_KEY}"

          if [ -z "$url" ] || [ "$url" = "https://test.supabase.co" ]; then
            echo "::error::RLS regression is enabled, but VITE_SUPABASE_URL or VITE_SUPABASE_TEST_URL is missing."
            exit 1
          fi

          if [ -z "$anon" ] || [ "$anon" = "test-anon-key" ]; then
            echo "::error::RLS regression is enabled, but VITE_SUPABASE_PUBLISHABLE_KEY or VITE_SUPABASE_TEST_ANON_KEY is missing."
            exit 1
          fi

          if [ -z "$service" ]; then
            echo "::error::RLS regression is enabled, but SUPABASE_SERVICE_ROLE_KEY or SUPABASE_TEST_SERVICE_ROLE_KEY is missing."
            exit 1
          fi
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VITE_SUPABASE_TEST_URL: ${{ secrets.VITE_SUPABASE_TEST_URL }}
          SUPABASE_TEST_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_ROLE_KEY }}
          VITE_SUPABASE_TEST_ANON_KEY: ${{ secrets.VITE_SUPABASE_TEST_ANON_KEY }}

      - name: Run RLS regression test
        run: npx vitest run src/test/rls-regression.test.ts --reporter=verbose
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VITE_SUPABASE_TEST_URL: ${{ secrets.VITE_SUPABASE_TEST_URL }}
          SUPABASE_TEST_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_ROLE_KEY }}
          VITE_SUPABASE_TEST_ANON_KEY: ${{ secrets.VITE_SUPABASE_TEST_ANON_KEY }}

      - name: Upload test output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rls-regression-output
          path: |
            test-output.log
          retention-days: 7
