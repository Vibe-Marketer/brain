  - name: OpenRouter
    purpose: "Routing layer to AI providers (Anthropic, OpenAI) for ask_call / extract_action_items / sentiment / coaching MCP tools"
    data_processed: ["transcript text", "user prompts", "tool responses"]
    region: gap
    dpa_signed: gap
    compliance_inheritance: gap
    public_trust_page: "https://openrouter.ai/privacy"
    notes: "OpenRouter is the proxy; ultimate processors are Anthropic and/or OpenAI per request"
  - name: Anthropic
    purpose: "LLM provider for AI-tier MCP tools (via OpenRouter)"
    data_processed: ["transcript text passed for inference"]
    region: "US"
    dpa_signed: gap
    compliance_inheritance: ["SOC 2 Type II", "HIPAA BAA available", "ISO 27001"]
    public_trust_page: "https://trust.anthropic.com"
  - name: OpenAI
