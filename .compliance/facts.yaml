    region: gap
    dpa_signed: gap
    compliance_inheritance: gap  # Polar's own posture
    public_trust_page: "https://polar.sh/legal/terms"
    notes: "Polar uses Stripe as its payment processor; CallVault contracts with Polar, not Stripe directly"
  - name: Stripe
    purpose: "Payment processing (via Polar as billing-of-record)"
    data_processed: ["card data (Stripe-hosted Checkout, never touches CallVault servers)", "payment receipts"]
