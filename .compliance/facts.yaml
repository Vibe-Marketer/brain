    data_processed: ["transcript text passed for inference"]
    region: "US"
    dpa_signed: gap
    compliance_inheritance: ["SOC 2 Type II", "CSA STAR Level 1", "HIPAA BAA available"]
    public_trust_page: "https://trust.openai.com"

