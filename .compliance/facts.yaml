code_and_change_management:
  # Reality from Phase A evidence sweep 2026-05-29 (FINDING-003)
  branch_protection_main: "Status checks required (security check); PR-required NOT enforced; admin bypass allowed"
  branch_protection_confidence: confirmed-via-screenshot  # github/branch-protection-rule-detail.png
  pr_required_setting: false  # ⬜ unchecked in actual rule
  required_reviewers_count: 0  # not enforced
  bypass_prevention_enabled: false  # ⬜ unchecked
  force_push_blocked: true  # ⬜ Allow force pushes unchecked = blocked
  deletion_blocked: true   # ⬜ Allow deletions unchecked = blocked
  deploy_method: "Vercel auto-deploys from push to main"
  deploy_method_confidence: confirmed  # documented in CLAUDE.md
  rollback_strategy: "Vercel instant rollback to prior deployment"
  rollback_confidence: confirmed
  # Remediation applied 2026-05-31 via gh CLI:
  remediation_applied:
    pr_required: true
    required_approving_review_count: 0  # solo-principal exception — see deviation note below
    dismiss_stale_reviews: true
    status_checks_strict: true
    status_check_contexts: ["security"]
    enforce_admins: false  # solo-principal exception — see deviation note below
    allow_force_pushes: false
    allow_deletions: false
    applied_via: "gh api -X PUT repos/Vibe-Marketer/brain/branches/main/protection"
    applied_at: 2026-05-31T06:09:00Z
    evidence: ".compliance/evidence/2026-05-30/github-recapture/branch-protection-rules-list.png"
  deviation_note: |
    Two deviations from the maximally-strict configuration, both justified by single-principal stage:
    - required_approving_review_count is 0 (not 1) because GitHub does not allow self-approval and Andrew is the sole reviewer
    - enforce_admins is false (not true) because the active development workflow (25+ uncommitted compliance files) operates direct-to-main; flipping to true would block all current work
    Both will tighten to 1 review + enforce_admins=true once a second principal or designated reviewer exists.

