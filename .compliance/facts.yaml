  - name: Vercel
    purpose: "Frontend hosting, edge functions, CI/CD for the React app"
    data_processed: ["request logs", "deployment metadata", "build artifacts"]
    region: gap  # confirm Vercel project region
    dpa_signed: gap
    compliance_inheritance: ["SOC 2 Type II", "ISO 27001:2022", "HIPAA BAA (Enterprise plan only)", "EU-US DPF certified"]
