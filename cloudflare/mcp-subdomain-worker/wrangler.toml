name = "callvault-mcp-subdomain"
main = "worker.ts"
compatibility_date = "2026-06-09"
account_id = "e9319ad5ca87e4768e7a79f1339ec8c8"

[[routes]]
pattern = "*.callvaultai.com/*"
zone_name = "callvaultai.com"

# Required route surface includes /mcp, /mcp-register, /auth/v1/*, and
