name = "callvault-api-proxy"
main = "worker.ts"
compatibility_date = "2026-05-07"
account_id = "e9319ad5ca87e4768e7a79f1339ec8c8"

# Bind the worker to api.callvaultai.com via Custom Domain.
# Custom Domains automatically cover the entire hostname (no wildcard needed)
# and create the DNS record + SSL cert when the worker deploys.
[[routes]]
pattern = "api.callvaultai.com"
custom_domain = true

# Logs are emitted to console.log/console.error and visible in `wrangler tail`.
[observability]
enabled = true
