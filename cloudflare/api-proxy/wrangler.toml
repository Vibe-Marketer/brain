name = "callvault-api-proxy"
main = "worker.ts"
compatibility_date = "2026-05-07"
account_id = "e9319ad5ca87e4768e7a79f1339ec8c8"

# Bind the worker to api.callvaultai.com via Custom Domain.
# Custom Domains automatically cover the entire hostname (no wildcard needed)
# and create the DNS record + SSL cert when the worker deploys.
[[routes]]
pattern = "api.callvaultai.com"
custom_domain = true

# Canonical MCP hostname: mcp.callvaultai.com — routes to the SAME worker.
# Added 2026-05-13 to bypass Perplexity's cached failure of the api.* host,
# then promoted as the user-facing MCP endpoint. The api.* /mcp routes remain
# compatibility aliases.
# Host-awareness is implemented in the worker (X-Forwarded-Host) and the
# Supabase functions (mcp-server, mcp-oauth-metadata) so all advertised URLs
# reflect the host the client originally hit.
# See .planning/debug/resolved/mcp-perplexity-still-failing-after-fixes.md.
[[routes]]
pattern = "mcp.callvaultai.com"
custom_domain = true

# Logs are emitted to console.log/console.error and visible in `wrangler tail`.
[observability]
enabled = true
