# ============================================================================
# JWT VERIFICATION (2026-03-30)
#
# All user-initiated functions use verify_jwt = false at the gateway level.
# Auth is enforced in function code via supabase.auth.getUser(token).
#
# Reason: Supabase now issues ES256 asymmetric JWTs. The gateway's built-in
# verify_jwt = true check rejects these with HTTP 401 "Invalid JWT" before
# the function code even runs. Function-level auth via getUser() handles
# all JWT formats correctly through the auth API.
#
# Security: All user functions call supabase.auth.getUser(token) and return
# 401 if the user is invalid — equivalent protection, no gateway dependency.
#
# LEGITIMATELY NO JWT (webhooks — cannot have user JWT):
#   webhook              — receives external Fathom webhook callbacks
#   zoom-webhook         — receives external Zoom webhook callbacks
#   polar-webhook        — receives external Polar payment webhook callbacks
# ============================================================================

